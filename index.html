<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial;
  margin: 0;
  font-size: 16px;
  background: #fff;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 14px;
}

input, select, button {
  width: 100%;
  margin: 8px 0;
  padding: 14px;
  font-size: 16px;
}

button {
  cursor: pointer;
}

.hidden {
  display: none;
}

#toast {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 10px;
  font-size: 14px;
  display: none;
  max-width: 90%;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox">
    <select id="username">
      <option>Caricamento utenti...</option>
    </select>

    <input id="pin" placeholder="PIN 6 cifre" inputmode="numeric">

    <button id="btnLogin">Login</button>
  </div>

  <!-- COMPLETA DATI -->
  <div id="completeBox" class="hidden">
    <input id="email" placeholder="Email">
    <input id="matricola" placeholder="Matricola 5 cifre">
    <button id="btnComplete">Salva dati</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <input id="d_user" disabled>
    <input id="d_pin">
    <input id="d_email">
    <input id="d_mat">

    <button id="btnSave">Salva</button>
  </div>

</div>

<div id="toast"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxv3mVz0BPDhOKE7rDK0w-S002WAS-Vu8Qvr5DS6Ez4m9UMi-a91mWJyZfZYLV6P2QQ/exec";

let currentUser = null;
let busy = false;

// ===== TOAST
function toast(msg){
  let t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=> t.style.display="none", 2200);
}

// ===== LOAD USERS (FIX ROBUSTO)
function loadUsers(){

  fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({ action: "getUsers" })
  })
  .then(r => r.text())
  .then(text => {

    let users;

    try {
      users = JSON.parse(text);
    } catch (e) {
      console.error("Risposta non valida:", text);
      toast("Errore caricamento utenti");
      return;
    }

    let s = document.getElementById("username");
    s.innerHTML = '<option value="">Seleziona utente</option>';

    users.forEach(u => {
      let o = document.createElement("option");
      o.value = u;
      o.textContent = u;
      s.appendChild(o);
    });

  })
  .catch(err => {
    console.error(err);
    toast("Errore caricamento utenti");
  });
}

// ===== INIT
window.onload = function(){

  loadUsers();

  let saved = localStorage.getItem("session");
  if(saved){
    currentUser = JSON.parse(saved);
    openDashboard();
  }

  btnLogin.onclick = login;
  btnComplete.onclick = complete;
  btnSave.onclick = save;
}

// ===== LOGIN
function login(){
  if(busy) return;
  busy = true;

  let u = username.value;
  let p = pin.value;

  if(!u){ toast("Seleziona utente"); busy=false; return; }
  if(!/^\d{6}$/.test(p)){ toast("PIN non valido"); busy=false; return; }

  fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({action:"login",username:u,pin:p})
  })
  .then(r=>r.json())
  .then(res=>{
    busy=false;

    if(!res.success){
      toast("Login errato");
      return;
    }

    currentUser = res.user;
    localStorage.setItem("session", JSON.stringify(currentUser));

    if(!currentUser.email || !currentUser.matricola){
      loginBox.classList.add("hidden");
      completeBox.classList.remove("hidden");
    } else {
      openDashboard();
    }
  });
}

// ===== COMPLETA DATI
function complete(){
  if(busy) return;
  busy = true;

  let email = document.getElementById("email").value;
  let mat = document.getElementById("matricola").value;

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){
    toast("Email non valida"); busy=false; return;
  }

  if(!/^\d{5}$/.test(mat)){
    toast("Matricola non valida"); busy=false; return;
  }

  currentUser.email = email;
  currentUser.matricola = mat;

  save(true);
}

// ===== DASHBOARD
function openDashboard(){
  loginBox.classList.add("hidden");
  completeBox.classList.add("hidden");
  dashboard.classList.remove("hidden");

  d_user.value = currentUser.username;
  d_pin.value = currentUser.pin;
  d_email.value = currentUser.email;
  d_mat.value = currentUser.matricola;
}

// ===== SAVE
function save(fromComplete=false){
  if(busy) return;
  busy = true;

  let pinVal = d_pin.value;
  let emailVal = d_email.value;
  let matVal = d_mat.value;

  if(!/^\d{6}$/.test(pinVal)){
    toast("PIN non valido"); busy=false; return;
  }

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(emailVal)){
    toast("Email non valida"); busy=false; return;
  }

  if(!/^\d{5}$/.test(matVal)){
    toast("Matricola non valida"); busy=false; return;
  }

  currentUser.pin = pinVal;
  currentUser.email = emailVal;
  currentUser.matricola = matVal;

  fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({action:"save",user:currentUser})
  })
  .then(r=>r.json())
  .then(res=>{
    busy=false;

    if(!res.success){
      toast(res.message || "Errore salvataggio");
      return;
    }

    localStorage.setItem("session", JSON.stringify(currentUser));
    toast("Salvato");
  });
}

</script>

</body>
</html>
