<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; margin:0; }
.container { max-width:400px; margin:auto; padding:15px; }

input, select, button {
  width:100%;
  margin:8px 0;
  padding:12px;
  font-size:16px;
}

.hidden { display:none; }

#toast {
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:10px;
  display:none;
}
</style>
</head>

<body>

<div class="container">

<div id="loginBox">
  <select id="username">
    <option>Caricamento utenti...</option>
  </select>
  <input id="pin" placeholder="PIN 6 cifre">
  <button onclick="login()" id="btnLogin">Login</button>
</div>

<div id="completeBox" class="hidden">
  <input id="email" placeholder="Email">
  <input id="matricola" placeholder="Matricola 5 cifre">
  <button onclick="complete()" id="btnComplete">Salva</button>
</div>

<div id="dashboard" class="hidden">
  <input id="d_user" disabled>
  <input id="d_pin">
  <input id="d_email">
  <input id="d_mat">
  <button onclick="save()" id="btnSave">Salva</button>
</div>

</div>

<div id="toast"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxX3bLyBYfxlV0OhYtAx5sNj1za7LS6JpuCrpXJ6remwWDKF7RXLK0OuBQTUAT3y7Qj/exec";

let currentUser = null;
let busy = false;

// ===== TOAST
function toast(t){
  let el = document.getElementById("toast");
  el.innerText=t;
  el.style.display="block";
  setTimeout(()=>el.style.display="none",2000);
}

// ===== INIT
window.onload = function(){

  // carica utenti
  fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({action:"getUsers"})
  })
  .then(r=>r.json())
  .then(users=>{

    let s = document.getElementById("username");

    s.innerHTML='<option value="">Seleziona utente</option>';

    users.forEach(u=>{
      let o=document.createElement("option");
      o.value=u;
      o.textContent=u;
      s.appendChild(o);
    });

  })
  .catch(err=>{
    toast("Errore caricamento utenti");
    console.error(err);
  });

  // sessione
  let saved = localStorage.getItem("session");
  if(saved){
    currentUser = JSON.parse(saved);
    openDashboard();
  }
}

// ===== LOGIN
function login(){
  if(busy) return;
  busy=true;

  let u=document.getElementById("username").value;
  let p=document.getElementById("pin").value;

  if(!u){ toast("Seleziona utente"); busy=false; return; }
  if(!/^[0-9]{6}$/.test(p)){ toast("PIN non valido"); busy=false; return; }

  fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({action:"login",username:u,pin:p})
  })
  .then(r=>r.json())
  .then(res=>{
    busy=false;

    if(!res.success){ toast("Errore login"); return; }

    currentUser=res.user;
    localStorage.setItem("session", JSON.stringify(currentUser));

    if(!currentUser.email || !currentUser.matricola){
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("completeBox").classList.remove("hidden");
    } else {
      openDashboard();
    }
  });
}

// ===== COMPLETA DATI
function complete(){
  if(busy) return;
  busy=true;

  let email=document.getElementById("email").value;
  let mat=document.getElementById("matricola").value;

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){
    toast("Email non valida"); busy=false; return;
  }

  if(!/^[0-9]{5}$/.test(mat)){
    toast("Matricola deve avere 5 cifre"); busy=false; return;
  }

  currentUser.email=email;
  currentUser.matricola=mat;

  save(true);
}

// ===== DASHBOARD
function openDashboard(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("completeBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("d_user").value=currentUser.username;
  document.getElementById("d_pin").value=currentUser.pin;
  document.getElementById("d_email").value=currentUser.email;
  document.getElementById("d_mat").value=currentUser.matricola;
}

// ===== SAVE
function save(fromComplete=false){
  if(busy) return;
  busy=true;

  let pinVal=document.getElementById("d_pin").value;
  let emailVal=document.getElementById("d_email").value;
  let matVal=document.getElementById("d_mat").value;

  if(!/^[0-9]{6}$/.test(pinVal)){
    toast("PIN non valido"); busy=false; return;
  }

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(emailVal)){
    toast("Email non valida"); busy=false; return;
  }

  if(!/^[0-9]{5}$/.test(matVal)){
    toast("Matricola non valida"); busy=false; return;
  }

  currentUser.pin=pinVal;
  currentUser.email=emailVal;
  currentUser.matricola=matVal;

  fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({action:"save",user:currentUser})
  })
  .then(r=>r.json())
  .then(res=>{
    busy=false;

    if(!res.success){
      toast(res.message || "Errore");
      return;
    }

    localStorage.setItem("session", JSON.stringify(currentUser));

    if(fromComplete){
      openDashboard();
    }

    toast("Salvato");
  });
}

</script>

</body>
</html>
