<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial;
  margin: 0;
  font-size: 16px;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 14px;
}

input, select, button {
  width: 100%;
  margin: 8px 0;
  padding: 14px;
  font-size: 16px;
}

.hidden { display: none; }

#toast {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 10px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox">
    <select id="username">
      <option>Caricamento utenti...</option>
    </select>

    <input id="pin" placeholder="PIN 6 cifre" inputmode="numeric">

    <button id="btnLogin">Login</button>
  </div>

  <!-- COMPLETAMENTO -->
  <div id="completeBox" class="hidden">
    <input id="email" placeholder="Email">
    <input id="matricola" placeholder="Matricola 5 cifre">
    <button id="btnComplete">Salva dati</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <input id="d_user" disabled>
    <input id="d_pin">
    <input id="d_email">
    <input id="d_mat">
    <button id="btnSave">Salva</button>
  </div>

</div>

<div id="toast"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxNAnwspYBz0oE_aWRxSsE_PdvNlvvjFEQmfcGkU0rmDmx-YjRJUiqcOnk8bgqMu2xj/exec"; // <-- IMPORTANTE

let currentUser = null;
let busy = false;

// ===== TOAST
function toast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=> t.style.display="none", 2000);
}

// ===== LOAD USERS
function loadUsers(){

  fetch(API + "?action=getUsers")
  .then(r=>r.json())
  .then(users=>{

    const s = document.getElementById("username");
    s.innerHTML = '<option value="">Seleziona utente</option>';

    users.forEach(u=>{
      const o = document.createElement("option");
      o.value = u;
      o.textContent = u;
      s.appendChild(o);
    });

  })
  .catch(err=>{
    console.error(err);
    toast("Errore caricamento utenti");
  });
}

// ===== LOGIN
function login(){

  if(busy) return;
  busy = true;

  const u = document.getElementById("username").value;
  const p = document.getElementById("pin").value;

  if(!u){
    toast("Seleziona utente");
    busy=false;
    return;
  }

  if(!/^\d{6}$/.test(p)){
    toast("PIN non valido");
    busy=false;
    return;
  }

  fetch(API + `?action=login&username=${encodeURIComponent(u)}&pin=${p}`)
  .then(r=>r.json())
  .then(res=>{
    busy=false;

    if(!res.success){
      toast("Login errato");
      return;
    }

    currentUser = res.user;
    localStorage.setItem("session", JSON.stringify(currentUser));

    if(!currentUser.email || !currentUser.matricola){
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("completeBox").classList.remove("hidden");
    } else {
      openDashboard();
    }
  })
  .catch(err=>{
    busy=false;
    console.error(err);
    toast("Errore rete");
  });
}

// ===== COMPLETA
function complete(){

  if(busy) return;
  busy=true;

  const email = document.getElementById("email").value;
  const mat = document.getElementById("matricola").value;

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){
    toast("Email non valida");
    busy=false;
    return;
  }

  if(!/^\d{5}$/.test(mat)){
    toast("Matricola non valida");
    busy=false;
    return;
  }

currentUser.email = email;
currentUser.matricola = mat;

busy = false;   // <-- FIX SEMPLICE E RISOLUTIVO
save(true);

}

// ===== DASHBOARD
function openDashboard(){

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("completeBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("d_user").value = currentUser.username;
  document.getElementById("d_pin").value = currentUser.pin;
  document.getElementById("d_email").value = currentUser.email;
  document.getElementById("d_mat").value = currentUser.matricola;
}

// ===== SAVE
function save(fromComplete=false){

  if(busy) return;
  busy=true;

  let pinVal, emailVal, matVal;

  if(fromComplete){
    pinVal = currentUser.pin;
    emailVal = currentUser.email;
    matVal = currentUser.matricola;
  } else {
    pinVal = document.getElementById("d_pin").value;
    emailVal = document.getElementById("d_email").value;
    matVal = document.getElementById("d_mat").value;
  }

  if(!/^\d{6}$/.test(pinVal)){
    toast("PIN non valido"); busy=false; return;
  }

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(emailVal)){
    toast("Email non valida"); busy=false; return;
  }

  if(!/^\d{5}$/.test(matVal)){
    toast("Matricola non valida"); busy=false; return;
  }

  currentUser.pin = pinVal;
  currentUser.email = emailVal;
  currentUser.matricola = matVal;

  fetch(API + `?action=save&username=${encodeURIComponent(currentUser.username)}&pin=${pinVal}&email=${encodeURIComponent(emailVal)}&matricola=${matVal}`)
  .then(r=>r.json())
  .then(res=>{
    busy=false;

    if(!res.success){
      toast(res.message || "Errore");
      return;
    }

    localStorage.setItem("session", JSON.stringify(currentUser));

    if(fromComplete){
      openDashboard();
    }

    toast("Salvato");
  })
  .catch(err=>{
    busy=false;
    console.error(err);
    toast("Errore rete");
  });
}

// ===== INIT
document.addEventListener("DOMContentLoaded", function(){

  loadUsers();

  document.getElementById("btnLogin").addEventListener("click", login);
  document.getElementById("btnComplete").addEventListener("click", complete);
  document.getElementById("btnSave").addEventListener("click", save);

  const saved = localStorage.getItem("session");
  if(saved){
    currentUser = JSON.parse(saved);
    openDashboard();
  }
});

</script>

</body>
</html>
