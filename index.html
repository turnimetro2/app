<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="icon.svg">


<title>Cambi Turno - WebApp</title>
<style>

 #ct_date:not(.hasFocus):invalid::before {
  content: "Inserisci la data del cambio turno";
  color: #777;
}

 #ct_date:invalid {
  color: transparent;
}
#ct_date.hasFocus {
  color: inherit;
}

 
/* Campo turno */
.ct_turno {
  width: 80px !important;   /* mostra bene 3 caratteri */
  text-align: center;
  font-size: 16px;
  padding: 10px;
}

/* Select collega */
.ct_user {
  width: 100%;
  min-width: 180px;
  padding: 10px;
  font-size: 16px;
}



  /* Primo campo username (disabilitato) con stessa altezza delle select */
#ct_container input[disabled] {
  height: 48px !important;
  padding: 10px !important;
  font-size: 16px !important;
  line-height: 26px !important;
}

 /* Raddoppia la larghezza della colonna username nella prima riga */
#ct_container .row:first-child > div:first-child {
  flex: 8 !important;
}

/* Mantiene la colonna turno della prima riga alla larghezza normale */
#ct_container .row:first-child > div:nth-child(2) {
  flex: 1 !important;
}

 
/* Pulsante elimina riga */
.ct_remove {
  width: 26px;
  height: 26px;
  background: #e0e0e0;
  color: #444;
  border: none;
  border-radius: 50%;
  font-weight: bold;
  cursor: pointer;
  line-height: 26px;
  text-align: center;
  padding: 0;
  transition: background 0.2s ease;
}

.ct_remove:hover {
  background: #bdbdbd;
}


 
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    font-size: 16px;
  }

  .container {
    max-width: 420px;
    margin: 0 auto;
    padding: 16px;
  }

  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }

.pinToggle {
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
  fill:#666;
  opacity:0.55;
  cursor:pointer;
  transition:opacity 0.2s ease;
}

.pinToggle:hover {
  opacity:0.9;
}

 
  label {
    display: block;
    font-size: 14px;
    margin-top: 8px;
    margin-bottom: 4px;
  }

  input, select, button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 10px;
  }

  input:disabled {
    background: #eee;
  }

  button {
    background: #1976d2;
    color: #fff;
    border: none;
    font-weight: 600;
  }

  button:disabled {
    opacity: 0.6;
  }

  .hidden {
    display: none;
  }

  #toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 14px;
    display: none;
    z-index: 999;

     text-align: center;   /* <--- AGGIUNGI QUESTA */
  white-space: pre-line; /* <--- AGGIUNGI QUESTA */
   
  }

  .version {
    text-align: center;
    font-size: 11px;
    color: #777;
    margin-top: 10px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  .row > div {
    flex: 1;
  }
</style>
</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div id="boxLogin" class="card">
    <h2 style="font-size:18px;margin-top:0;">Login</h2>

    <label for="selUser">Seleziona username</label>
    <select id="selUser">
      <option value="">Caricamento utenti...</option>
    </select>

    <label for="pin">PIN (6 cifre)</label>


   <div style="position:relative;">
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN (6 cifre)">
<svg id="togglePinLogin" class="pinToggle" viewBox="0 0 24 24">
  <path id="togglePinLoginPath" d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/>
</svg>


</div>

   

    <button id="btnLogin">Login</button>
  </div>

  <!-- COMPLETAMENTO DATI -->
  <div id="boxComplete" class="card hidden">


  

   
    <h2 style="font-size:18px;margin-top:0;">Completa i tuoi dati</h2>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="esempio@dominio.it">

    <label for="matricola">Matricola (5 cifre)</label>
    <input id="matricola" type="text" inputmode="numeric" maxlength="5" placeholder="es. 01234">

    <button id="btnComplete">Salva dati</button>
    <button id="btnLogout2" style="margin-top:10px;background:#c62828;">Logout</button>
  </div>

  <!-- DASHBOARD -->
  <div id="boxDashboard" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Profilo utente</h2>

    <label for="d_user">Username</label>
    <input id="d_user" type="text" disabled>

    <label for="d_pin">PIN (6 cifre)</label>

   
    <div style="position:relative;">
  <input id="d_pin" type="password" inputmode="numeric" maxlength="6">
<svg id="togglePinProfile" class="pinToggle" viewBox="0 0 24 24">
  <path id="togglePinProfilePath" d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/>
</svg>


</div>


    <label for="d_email">Email</label>
    <input id="d_email" type="email">

    <label for="d_mat">Matricola (5 cifre)</label>
    <input id="d_mat" type="text" inputmode="numeric" maxlength="5">

    <button id="btnSave">Salva</button>
   <button id="btnLogout" style="margin-top:10px;background:#c62828;">Logout</button>
   <button id="btnCambioTurno" style="margin-top:10px;background:#455a64;">Cambio turno</button>

  </div>


  <!-- CAMBIO TURNO (solo visualizzazione locale) -->
  <div id="boxCambioTurno" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Inserimento cambio turno</h2>

    
    <input id="ct_date" type="date" style="margin-bottom:15px;" 
       onfocus="this.classList.add('hasFocus')" 
       onblur="this.classList.remove('hasFocus')">


    <div id="ct_container"></div>

    <button id="ct_addUser" style="background:#607d8b;margin-top:10px;">Aggiungi collega</button>
    <button id="ct_save" style="background:#1976d2;margin-top:10px;">Genera riepilogo</button>

<button id="ct_sendMail" style="background:#00796b;margin-top:10px;">Crea email</button>

   
    <button id="ct_reset" style="background:#b71c1c;margin-top:10px;">Reset campi</button>

    <!-- NUOVO RIQUADRO EMAIL DESTINATARI -->
    <div id="ct_emails" style="
      margin-top:15px;
      font-size:14px;
      color:#333;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      background:#fafafa;
      white-space:normal;
      word-break:break-all;
    "></div>

    <button id="ct_copyEmails" style="background:#009688;margin-top:10px;">Copia destinatari</button>

    <!-- RIQUADRO ESISTENTE RIEPILOGO CAMBIO TURNO -->
    <div id="ct_output" style="
      margin-top:15px;
      font-size:14px;
      color:#333;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      background:#fafafa;
      white-space:pre-line;
    "></div>

    <button id="ct_copy" style="background:#009688;margin-top:10px;">Copia corpo mail</button>

   <button id="ct_backProfile" style="background:#455a64;margin-top:10px;">Profilo utente</button>

  </div>


</div>

<div id="toast"></div>

<script src="script.js"></script>

 <div id="loaderOverlay" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #333;
  z-index: 9999;
  backdrop-filter: blur(2px);
">
  Ripristino sessione in corso…
</div>

</body>
</html>
