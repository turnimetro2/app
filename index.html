<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icon.png">

<title>Cambi Turno - WebApp</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    font-size: 16px;
  }

  .container {
    max-width: 420px;
    margin: 0 auto;
    padding: 16px;
  }

  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 14px;
    margin-top: 8px;
    margin-bottom: 4px;
  }

  input, select, button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 10px;
  }

  input:disabled {
    background: #eee;
  }

  button {
    background: #1976d2;
    color: #fff;
    border: none;
    font-weight: 600;
  }

  button:disabled {
    opacity: 0.6;
  }

  .hidden {
    display: none;
  }

  #toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 14px;
    display: none;
    z-index: 999;
  }

  .version {
    text-align: center;
    font-size: 11px;
    color: #777;
    margin-top: 10px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  .row > div {
    flex: 1;
  }
</style>
</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div id="boxLogin" class="card">
    <h2 style="font-size:18px;margin-top:0;">Login</h2>

    <label for="selUser">Seleziona username</label>
    <select id="selUser">
      <option value="">Caricamento utenti...</option>
    </select>

    <label for="pin">PIN (6 cifre)</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN (6 cifre)">

    <button id="btnLogin">Login</button>
  </div>

  <!-- COMPLETAMENTO DATI -->
  <div id="boxComplete" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Completa i tuoi dati</h2>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="esempio@dominio.it">

    <label for="matricola">Matricola (5 cifre)</label>
    <input id="matricola" type="text" inputmode="numeric" maxlength="5" placeholder="es. 01234">

    <button id="btnComplete">Salva dati</button>
  </div>

  <!-- DASHBOARD -->
  <div id="boxDashboard" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Profilo utente</h2>

    <label for="d_user">Username</label>
    <input id="d_user" type="text" disabled>

    <label for="d_pin">PIN (6 cifre)</label>
    <input id="d_pin" type="password" inputmode="numeric" maxlength="6">

    <label for="d_email">Email</label>
    <input id="d_email" type="email">

    <label for="d_mat">Matricola (5 cifre)</label>
    <input id="d_mat" type="text" inputmode="numeric" maxlength="5">

    <button id="btnSave">Salva</button>
   <button id="btnCambioTurno" style="margin-top:10px;background:#455a64;">Cambio turno</button>

  </div>


  <!-- CAMBIO TURNO (solo visualizzazione locale) -->
  <div id="boxCambioTurno" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Inserimento cambio turno</h2>
  <label for="ct_date">Data</label>
  <input id="ct_date" type="date" style="margin-bottom:15px;">
    <div id="ct_container"></div>

    <button id="ct_addUser" style="background:#607d8b;margin-top:10px;">Aggiungi collega</button>
    <button id="ct_save" style="background:#1976d2;margin-top:10px;">Salva</button>
<button id="ct_reset" style="background:#b71c1c;margin-top:10px;">Reset</button>

    <div id="ct_output" style="
  margin-top:15px;
  font-size:14px;
  color:#333;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fafafa;
  white-space:pre-line;
"></div>

   <button id="ct_copy" style="background:#009688;margin-top:10px;">Copia</button>

  </div>

</div>

<div id="toast"></div>
<div class="version">Release WebApp 0.1</div>

<script src="script.js"></script>
</body>
</html>
