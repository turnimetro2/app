<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial;
  margin: 0;
  font-size: 16px;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 14px;
}

input, select, button {
  width: 100%;
  margin: 8px 0;
  padding: 14px;
  font-size: 16px;
}

.hidden { display: none; }

#toast {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 10px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <div id="loginBox">
    <select id="username">
      <option>Caricamento utenti...</option>
    </select>

    <input id="pin" placeholder="PIN 6 cifre" inputmode="numeric">

    <button id="btnLogin">Login</button>
  </div>

  <div id="completeBox" class="hidden">
    <input id="email" placeholder="Email">
    <input id="matricola" placeholder="Matricola 5 cifre">
    <button id="btnComplete">Salva dati</button>
  </div>

  <div id="dashboard" class="hidden">
    <input id="d_user" disabled>
    <input id="d_pin">
    <input id="d_email">
    <input id="d_mat">
    <button id="btnSave">Salva</button>
  </div>

</div>

<div id="toast"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzx1xcvsnT7TcYMA2njvUXGdQJ4dAf5BJA-Svo_MnzYpvnoLu6ZweCJ6CQmtGqVlO5o/exec";

let currentUser = null;
let busy = false;

// ===== TOAST
function toast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=> t.style.display="none", 2000);
}

// ===== LOAD USERS
function loadUsers(){

  fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({action:"getUsers"})
  })
  .then(r=>r.text())
  .then(text=>{
    let users;

    try {
      users = JSON.parse(text);
    } catch(e){
      console.error(text);
      toast("Errore caricamento utenti");
      return;
    }

    const s = document.getElementById("username");
    s.innerHTML = '<option value="">Seleziona utente</option>';

    users.forEach(u=>{
      const o = document.createElement("option");
      o.value = u;
      o.textContent = u;
      s.appendChild(o);
    });

  })
  .catch(err=>{
    console.error(err);
    toast("Errore caricamento utenti");
  });
}

// ===== LOGIN
function login(){

  if(busy) return;
  busy = true;

  const u = document.getElementById("username").value;
  const p = document.getElementById("pin").value;

  if(!u){
    toast("Seleziona utente");
    busy=false;
    return;
  }

  if(!/^\d{6}$/.test(p)){
    toast("PIN non valido");
    busy=false;
    return;
  }

  fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({action:"login",username:u,pin:p})
  })
  .then(r=>r.json())
  .then(res=>{
    busy=false;

    if(!res.success){
      toast("Login errato");
      return;
    }

    currentUser = res.user;
    localStorage.setItem("session", JSON.stringify(currentUser));

    if(!currentUser.email || !currentUser.matricola){
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("completeBox").classList.remove("hidden");
    } else {
      openDashboard();
    }
  })
  .catch(err=>{
    busy=false;
    console.error(err);
    toast("Errore rete");
  });
}

// ===== COMPLETA
function complete(){

  if(busy) return;
  busy=true;

  const email = document.getElementById("email").value;
  const mat = document.getElementById("matricola").value;

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){
    toast("Email non valida");
    busy=false;
    return;
  }

  if(!/^\d{5}$/.test(mat)){
    toast("Matricola non valida");
    busy=false;
    return;
  }

  currentUser.email=email;
  currentUser.matricola=mat;

  save(true);
}

// ===== DASHBOARD
function openDashboard(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("completeBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("d_user").value=currentUser.username;
  document.getElementById("d_pin").value=currentUser.pin;
  document.getElementById("d_email").value=currentUser.email;
  document.getElementById("d_mat").value=currentUser.matricola;
}

// ===== SAVE
function save(fromComplete=false){

  if(busy) return;
  busy=true;

  const pinVal = document.getElementById("d_pin").value;
  const emailVal = document.getElementById("d_email").value;
  const matVal = document.getElementById("d_mat").value;

  if(!/^\d{6}$/.test(pinVal)){
    toast("PIN non valido"); busy=false; return;
  }

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(emailVal)){
    toast("Email non valida"); busy=false; return;
  }

  if(!/^\d{5}$/.test(matVal)){
    toast("Matricola non valida"); busy=false; return;
  }

  currentUser.pin=pinVal;
  currentUser.email=emailVal;
  currentUser.matricola=matVal;

  fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({action:"save",user:currentUser})
  })
  .then(r=>r.json())
  .then(res=>{
    busy=false;

    if(!res.success){
      toast(res.message || "Errore");
      return;
    }

    localStorage.setItem("session", JSON.stringify(currentUser));

    if(fromComplete){
      openDashboard();
    }

    toast("Salvato");
  })
  .catch(err=>{
    busy=false;
    console.error(err);
    toast("Errore rete");
  });
}

// ===== INIT SICURO
document.addEventListener("DOMContentLoaded", function(){

  loadUsers();

  document.getElementById("btnLogin").addEventListener("click", login);
  document.getElementById("btnComplete").addEventListener("click", complete);
  document.getElementById("btnSave").addEventListener("click", save);

  let saved = localStorage.getItem("session");
  if(saved){
    currentUser = JSON.parse(saved);
    openDashboard();
  }
});

</script>

</body>
</html>
