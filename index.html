<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial;
  margin: 0;
  font-size: 16px;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 12px;
}

input, select, button {
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  font-size: 16px;
}

.hidden { display: none; }

#toast {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 10px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN / REGISTER -->
<div id="authBox">

  <select id="username">
    <option>Caricamento utenti...</option>
  </select>

  <!-- LOGIN PIN -->
  <div id="loginFields">
    <input id="pin" placeholder="PIN 6 cifre" inputmode="numeric">
  </div>

  <!-- REGISTER FIELDS (DINAMICI) -->
  <div id="registerFields" class="hidden">
    <input id="email" placeholder="Email">
    <input id="mat" placeholder="Matricola 5 cifre">
  </div>

  <button onclick="login()">Login</button>
  <button onclick="register()">Registrati</button>

</div>

<!-- DASHBOARD -->
<div id="dash" class="hidden">
  <input id="d_user" disabled>
  <input id="d_pin">
  <input id="d_email">
  <input id="d_mat">
  <button onclick="save()">Salva</button>
</div>

</div>

<div id="toast"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbz4ne6irMSKQUwP3QxzPmOtXzHcbWeub3Ak3mH3xQz0a8zI2Z8KGZa2dJq-YCXvSzRt/exec";

let currentUser = null;
let mode = "login";

// ===== TOAST =====
function toast(t){
  let el=document.getElementById("toast");
  el.innerText=t;
  el.style.display="block";
  setTimeout(()=>el.style.display="none",2000);
}

// ===== LOAD USERS =====
fetch(API,{
  method:"POST",
  body: JSON.stringify({action:"getUsers"})
})
.then(r=>r.json())
.then(users=>{
  let s=document.getElementById("username");
  s.innerHTML='<option value="">Seleziona utente</option>';

  users.forEach(u=>{
    let o=document.createElement("option");
    o.value=u;
    o.textContent=u;
    s.appendChild(o);
  });
});

// ===== SWITCH MODE =====
function register(){
  mode = "register";

  document.getElementById("loginFields").classList.add("hidden");
  document.getElementById("registerFields").classList.remove("hidden");

  toast("Modalità registrazione");
}

// ===== LOGIN =====
function login(){

  let u=username.value;

  if(mode === "login"){
    let p=pin.value;

    if(!u){ toast("Seleziona utente"); return; }

    if(!/^[0-9]{6}$/.test(p)){
      toast("PIN non valido");
      return;
    }

    fetch(API,{
      method:"POST",
      body: JSON.stringify({action:"login",username:u,pin:p})
    })
    .then(r=>r.json())
    .then(res=>{
      if(!res.success){ toast("Errore login"); return; }

      currentUser=res.user;
      openDash();
    });

  } else {

    // REGISTER FLOW
    let email=document.getElementById("email").value;
    let mat=document.getElementById("mat").value;

    if(!u){ toast("Seleziona utente"); return; }

    if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){
      toast("Email non valida");
      return;
    }

    if(!/^[1-9][0-9]{4}$/.test(mat)){
      toast("Matricola non valida");
      return;
    }

    fetch(API,{
      method:"POST",
      body: JSON.stringify({
        action:"register",
        username:u,
        email:email,
        matricola:mat
      })
    })
    .then(r=>r.json())
    .then(res=>{
      if(!res.success){
        toast(res.message || "Utente già registrato");
        return;
      }

      toast("Registrazione completata. Email inviata.");
      mode="login";

      document.getElementById("loginFields").classList.remove("hidden");
      document.getElementById("registerFields").classList.add("hidden");
    });
  }
}

// ===== DASH =====
function openDash(){
  authBox.classList.add("hidden");
  dash.classList.remove("hidden");

  d_user.value=currentUser.username;
  d_pin.value=currentUser.pin;
  d_email.value=currentUser.email;
  d_mat.value=currentUser.matricola;
}

// ===== SAVE =====
function save(){
  fetch(API,{
    method:"POST",
    body: JSON.stringify({action:"save",user:currentUser})
  })
  .then(r=>r.json())
  .then(res=>{
    toast(res.success?"Salvato":"Errore");
  });
}

</script>

</body>
</html>
