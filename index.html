<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Cambi Turno - WebApp</title>
<style>
/* Campo turno */
.ct_turno {
  width: 80px !important;
  text-align: center;
  font-size: 16px;
  padding: 10px;
}

/* Select collega */
.ct_user {
  width: 100%;
  min-width: 180px;
  padding: 10px;
  font-size: 16px;
}

/* Turno da ciclazione (sola lettura) */
.ct_turno_reale {
  width: 60px !important;
  min-width: 60px;
  text-align: center;
  font-size: 16px;
  padding: 10px;
  background: #eeeeee;
  color: #555;
  border: 1px solid #ccc;
}

/* Campi modificabili del cambio turno */
#ct_container .ct_user {
  height: 48px !important;
  background: #fff !important;
}

#ct_date {
  background: #fff !important;
}

/* Segnaposto visibile sul campo data */
.ct_date_wrapper {
  position: relative;
}

.ct_date_placeholder {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: #888;
  font-size: 14px;
  font-style: italic;
  pointer-events: none;
}

.ct_date_placeholder.hidden {
  display: none;
}

/* Titoli centrati nei rispettivi riquadri */
#boxLogin > h2,
#boxDashboard > h2,
#boxCambioTurno > h2,
#boxRiepilogo > h2 {
  text-align: center;
}

/* Raddoppia la larghezza della colonna username nella prima riga */
#ct_container .row:first-child > div:first-child {
  flex: 8 !important;
}

/* Mantiene la colonna turno della prima riga alla larghezza normale */
#ct_container .row:first-child > div:nth-child(2) {
  flex: 1 !important;
}

/* Pulsante elimina riga */
.ct_remove {
  width: 26px;
  height: 26px;
  background: #e0e0e0;
  color: #444;
  border: none;
  border-radius: 50%;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.row > div:last-child {
  display: flex;
  align-items: center;
  justify-content: center;
}

.ct_remove:hover { background: #bdbdbd; }

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f5f5;
  font-size: 16px;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 16px;
}

.card {
  background: #fff;
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  margin-bottom: 16px;
}

.pinToggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  fill: #666;
  opacity: 0.55;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.pinToggle:hover { opacity: 0.9; }

label {
  display: block;
  font-size: 14px;
  margin-top: 8px;
  margin-bottom: 4px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
}

input:disabled { background: #eee; }

/* Selettore username nella schermata di login */
#selUser {
  background-color: #fff !important;
  color: #222;
}

/* Titoli centrati nei rispettivi riquadri */
#boxLogin > h2,
#boxDashboard > h2,
#boxCambioTurno > h2,
#boxRiepilogo > h2 {
  text-align: center;
}

/* Campi modificabili del cambio turno */
#ct_date,
#ct_container .ct_user {
  background: #fff;
}

/* Placeholder visibile nel campo data finché non viene scelta una data */
.ct_date_wrap {
  position: relative;
  width: 100%;
}

/* Il testo nativo della data viene nascosto */
#ct_date {
  color: transparent !important;
  text-align: center;
  position: relative;
  z-index: 1;
}

/* Placeholder sempre sopra il campo data */
#ct_date_placeholder {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  color: #888;
  font-style: italic;
  text-align: center;
  pointer-events: none;
  z-index: 2;
}

/* Data formattata */
#ct_date_text {
  z-index: 2;
}

/* Testo formattato mostrato dentro il campo data */
#ct_date_text {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  color: #222;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#ct_date_text.hidden {
  display: none;
}

/* Placeholder centrato nel campo data */
#ct_date_placeholder {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  color: #888;
  font-style: italic;
  text-align: center;
  pointer-events: none;
}

button {
  background: #1976d2;
  color: #fff;
  border: none;
  font-weight: 600;
}

button:disabled { opacity: 0.6; }

.hidden { display: none; }

#toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 10px 14px;
  border-radius: 20px;
  font-size: 14px;
  display: none;
  z-index: 999;
  text-align: center;
  white-space: pre-line;
}

.version {
  text-align: center;
  font-size: 11px;
  color: #777;
  margin-top: 10px;
}

.row { display: flex; gap: 8px; }

.row > div { flex: 1; }

.placeholder {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.placeholder::before {
  content: attr(data-placeholder);
  color: #888;
  font-style: italic;
  pointer-events: none;
}

/* Layout dedicato ai due campi turno */
.ct_turni_wrapper {
  display: flex;
  gap: 8px;
  align-items: center;
  width: 100%;
  min-width: 0;
}

/* Correzioni per schermi Android e telefoni stretti */
@media screen and (max-width: 600px) {

  #ct_container {
    width: 100%;
    min-width: 0;
  }

  #ct_container .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 28px;
    gap: 6px;
    width: 100%;
    min-width: 0;
    align-items: center;
    box-sizing: border-box;
  }

  #ct_container .row > div {
    flex: initial !important;
    width: 100%;
    min-width: 0;
  }

  #ct_container .ct_user,
  #ct_container .row > div > input[disabled] {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    padding-left: 5px;
    padding-right: 5px;
    box-sizing: border-box;
  }

  .ct_turni_wrapper {
    display: grid;
    grid-template-columns: minmax(0, 60px) minmax(0, 1fr);
    gap: 5px;
    width: 100%;
    min-width: 0;
  }

  #ct_container .ct_turno_reale,
  #ct_container .ct_turno {
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100%;
    padding: 10px 4px;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  #ct_container .ct_remove {
    width: 26px;
    min-width: 26px;
    padding: 0;
    margin: 0 auto 10px;
  }
}
</style>
</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div id="boxLogin" class="card">
    <h2 style="font-size:18px;margin-top:0;">Login utente</h2>

    <label for="selUser">Seleziona username</label>
    <select id="selUser">
      <option value="">Caricamento utenti...</option>
    </select>

    <label for="pin">PIN personale (6 cifre)</label>

    <div style="position:relative;">
      <input id="pin" type="password" inputmode="numeric"
        autocomplete="off" placeholder="PIN personale (6 cifre)">

      <svg id="togglePinLogin" class="pinToggle" viewBox="0 0 24 24">
        <path id="togglePinLoginPath"
          d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/>
      </svg>
    </div>

    <button id="btnLogin">Login</button>
  </div>

  <!-- COMPLETAMENTO DATI -->
  <div id="boxComplete" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Completa i tuoi dati</h2>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="esempio@dominio.it">

    <label for="matricola">Matricola (5 cifre)</label>
    <input id="matricola" type="text" inputmode="numeric"
      maxlength="5" placeholder="es. 01234">

    <button id="btnComplete">Salva dati</button>
    <button id="btnLogout2" style="margin-top:10px;background:#c62828;">Logout</button>
  </div>

  <!-- DASHBOARD -->
  <div id="boxDashboard" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Profilo utente</h2>

    <label for="d_user">Username</label>
    <input id="d_user" type="text" disabled>

    <label for="d_pin">PIN personale (6 cifre)</label>

    <div style="position:relative;">
      <input id="d_pin" type="password" inputmode="numeric" maxlength="6">

      <svg id="togglePinProfile" class="pinToggle" viewBox="0 0 24 24">
        <path id="togglePinProfilePath"
          d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/>
      </svg>
    </div>

    <label for="d_email">Email</label>
    <input id="d_email" type="email">

    <label for="d_mat">Matricola (5 cifre)</label>
    <input id="d_mat" type="text" inputmode="numeric" maxlength="5">

    <button id="btnSave">Salva</button>
    <button id="btnLogout" style="margin-top:10px;background:#c62828;">Logout</button>
    <button id="btnCambioTurno" style="margin-top:10px;background:#455a64;">Cambio turno</button>
  </div>

  <!-- CAMBIO TURNO -->
  <div id="boxCambioTurno" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Inserimento cambio turno</h2>

    <div class="ct_date_wrap" style="margin-bottom:15px;">
      <input id="ct_date" class="is-empty" type="date"
        style="margin-bottom:0;background:#fff;">

      <span id="ct_date_placeholder">seleziona una data</span>

      <span id="ct_date_text" class="hidden"></span>
    </div>

    <div id="ct_container"></div>

    <button id="ct_addUser" style="background:#607d8b;margin-top:10px;">Aggiungi collega</button>
    <button id="ct_save" style="background:#1976d2;margin-top:10px;">Genera riepilogo</button>
    <button id="ct_reset" style="background:#b71c1c;margin-top:10px;">Reset campi</button>
  </div>

  <!-- RIEPILOGO -->
  <div id="boxRiepilogo" class="card hidden">
    <h2 style="font-size:18px;margin-top:0;">Riepilogo email</h2>

    <div id="ct_emails"
      style="margin-top:15px;font-size:14px;color:#333;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fafafa;white-space:normal;word-break:break-all;">
    </div>

    <button id="ct_copyEmails" style="background:#009688;margin-top:10px;">Copia destinatari</button>

    <div id="ct_output"
      style="margin-top:15px;font-size:14px;color:#333;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fafafa;white-space:pre-line;">
    </div>

    <button id="ct_copy" style="background:#009688;margin-top:10px;">Copia corpo mail</button>
    <button id="ct_sendMail" style="background:#00796b;margin-top:10px;">Crea email</button>

    <button id="ct_backProfile" class="hidden"
      style="background:#455a64;margin:20px auto;display:block;width:90%;max-width:420px;">
      Profilo utente
    </button>
  </div>

</div>

<div id="toast"></div>

<script src="script.js"></script>

<div id="loaderOverlay"
  style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.85);display:none;align-items:center;justify-content:center;font-size:18px;color:#333;z-index:9999;backdrop-filter:blur(2px);">
  Ripristino sessione in corso…
</div>

</body>
</html>
