<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; margin:0; }
.container { max-width:420px; margin:auto; padding:15px; }

input, select, button {
  width:100%;
  margin:8px 0;
  padding:14px;
  font-size:16px;
}

.hidden { display:none; }

#toast {
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:10px;
  display:none;
}
</style>
</head>

<body>

<div class="container">

<div id="loginBox">
  <select id="username">
    <option>Caricamento utenti...</option>
  </select>

  <input id="pin" placeholder="PIN 6 cifre" inputmode="numeric">

  <button id="btnLogin">Login</button>
</div>

<div id="completeBox" class="hidden">
  <input id="email" placeholder="Email">
  <input id="matricola" placeholder="Matricola 5 cifre">

  <button id="btnComplete">Salva</button>
</div>

<div id="dashboard" class="hidden">
  <input id="d_user" disabled>
  <input id="d_pin">
  <input id="d_email">
  <input id="d_mat">

  <button id="btnSave">Salva</button>
  <button id="btnLogout">Logout</button>
</div>

</div>

<div id="toast"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwD1TVR4s-3HmEQD4CNNFU0QMojPxfmrbtYH-cpZDm_Pi8cG_z43i3j_kT-B-F47hlQ/exec";

let currentUser = null;
let busy = false;

// ===== TOAST
function toast(msg){
  let t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=>t.style.display="none",2000);
}

// ===== API
async function callAPI(data){
  let r = await fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(data)
  });
  return await r.json();
}

// ===== INIT
window.onload = async function(){

  // utenti
  try{
    let users = await callAPI({action:"getUsers"});

    let s = document.getElementById("username");
    s.innerHTML = '<option value="">Seleziona utente</option>';

    users.forEach(u=>{
      let o = document.createElement("option");
      o.value=u;
      o.textContent=u;
      s.appendChild(o);
    });

  }catch(e){
    toast("Errore caricamento utenti");
  }

  // sessione
  let saved = localStorage.getItem("session");
  if(saved){
    currentUser = JSON.parse(saved);
    openDashboard();
  }

  btnLogin.onclick = login;
  btnComplete.onclick = complete;
  btnSave.onclick = save;
  btnLogout.onclick = logout;
}

// ===== LOGIN
async function login(){
  if(busy) return;
  busy=true;

  let u = username.value;
  let p = pin.value;

  if(!u){ toast("Seleziona utente"); busy=false; return; }
  if(!/^\d{6}$/.test(p)){ toast("PIN non valido"); busy=false; return; }

  let res = await callAPI({action:"login",username:u,pin:p});
  busy=false;

  if(!res.success){ toast("Errore login"); return; }

  currentUser = res.user;
  localStorage.setItem("session", JSON.stringify(currentUser));

  if(!currentUser.email || !currentUser.matricola){
    loginBox.classList.add("hidden");
    completeBox.classList.remove("hidden");
  } else {
    openDashboard();
  }
}

// ===== COMPLETA
async function complete(){
  if(busy) return;
  busy=true;

  let email = document.getElementById("email").value;
  let mat = document.getElementById("matricola").value;

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){
    toast("Email non valida"); busy=false; return;
  }

  if(!/^\d{5}$/.test(mat)){
    toast("Matricola non valida"); busy=false; return;
  }

  currentUser.email=email;
  currentUser.matricola=mat;

  await save(true);
}

// ===== DASH
function openDashboard(){
  loginBox.classList.add("hidden");
  completeBox.classList.add("hidden");
  dashboard.classList.remove("hidden");

  d_user.value=currentUser.username;
  d_pin.value=currentUser.pin;
  d_email.value=currentUser.email;
  d_mat.value=currentUser.matricola;
}

// ===== SAVE
async function save(fromComplete=false){
  if(busy) return;
  busy=true;

  let pinVal = d_pin.value;
  let emailVal = d_email.value;
  let matVal = d_mat.value;

  if(!/^\d{6}$/.test(pinVal)){
    toast("PIN non valido"); busy=false; return;
  }

  if(!/^[^@]+@[^@]+\.[^@]+$/.test(emailVal)){
    toast("Email non valida"); busy=false; return;
  }

  if(!/^\d{5}$/.test(matVal)){
    toast("Matricola non valida"); busy=false; return;
  }

  currentUser.pin=pinVal;
  currentUser.email=emailVal;
  currentUser.matricola=matVal;

  let res = await callAPI({action:"save",user:currentUser});
  busy=false;

  if(!res.success){
    toast(res.message || "Errore");
    return;
  }

  localStorage.setItem("session", JSON.stringify(currentUser));

  if(fromComplete){
    openDashboard();
  }

  toast("Salvato");
}

// ===== LOGOUT
function logout(){
  localStorage.removeItem("session");
  location.reload();
}

</script>

</body>
</html>
