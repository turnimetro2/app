<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  margin:0;
  background:#fff;
}

.wrap{
  max-width:420px;
  margin:auto;
  padding:15px;
}

input,select,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  font-size:16px;
  box-sizing:border-box;
}

button{
  cursor:pointer;
}

.hidden{
  display:none;
}

#toast{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:12px;
  display:none;
  max-width:90%;
  text-align:center;
}
</style>
</head>
<body>

<div class="wrap">

  <!-- LOGIN -->
  <div id="loginBox">
    <select id="username">
      <option>Caricamento utenti...</option>
    </select>

    <input id="pin" placeholder="PIN 6 cifre" inputmode="numeric">

    <button id="loginBtn">Login</button>
  </div>

  <!-- COMPLETAMENTO DATI -->
  <div id="completeBox" class="hidden">
    <input id="email" placeholder="Email">
    <input id="matricola" placeholder="Matricola 5 cifre">

    <button id="completeBtn">Salva</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" class="hidden">
    <input id="d_username" disabled>
    <input id="d_pin" inputmode="numeric">
    <input id="d_email">
    <input id="d_matricola" inputmode="numeric">

    <button id="saveBtn">Salva</button>
    <button id="logoutBtn">Logout</button>
  </div>

</div>

<div id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxCd0bdn9kYzUlUlSOtBrxKmVmHZANmNRqoDJ_NY7esqkl_gFandzXDOqgHA2b4RA2J/exec";

let currentUser = null;
let busy = false;

/* ======================
   TOAST
====================== */
function toast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";

  setTimeout(()=>{
    t.style.display="none";
  },2000);
}

/* ======================
   REQUEST
====================== */
async function api(payload){
  const res = await fetch(API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(payload)
  });

  return await res.json();
}

/* ======================
   LOCK CLICK
====================== */
function lock(){
  if(busy) return false;
  busy=true;
  return true;
}

function unlock(){
  busy=false;
}

/* ======================
   VALIDAZIONI
====================== */
function validEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

function validPin(v){
  return /^\d{6}$/.test(v);
}

function validMat(v){
  return /^\d{5}$/.test(v);
}

/* ======================
   LOAD USERS
====================== */
async function loadUsers(){
  try{
    const users = await api({action:"getUsers"});

    const sel = document.getElementById("username");
    sel.innerHTML = '<option value="">Seleziona utente</option>';

    users.forEach(u=>{
      const o = document.createElement("option");
      o.value=u;
      o.textContent=u;
      sel.appendChild(o);
    });

  }catch(e){
    toast("Errore caricamento utenti");
  }
}

/* ======================
   LOGIN
====================== */
async function login(){
  if(!lock()) return;

  const username = document.getElementById("username").value;
  const pin = document.getElementById("pin").value;

  if(!username){
    toast("Seleziona utente");
    unlock();
    return;
  }

  if(!validPin(pin)){
    toast("PIN non valido");
    unlock();
    return;
  }

  const res = await api({
    action:"login",
    username,
    pin
  });

  unlock();

  if(!res.success){
    toast("Credenziali errate");
    return;
  }

  currentUser = res.user;
  saveSession();

  if(!currentUser.email || !currentUser.matricola){
    showComplete();
  }else{
    showDash();
  }
}

/* ======================
   COMPLETE
====================== */
async function complete(){
  if(!lock()) return;

  const email = document.getElementById("email").value.trim();
  const matricola = document.getElementById("matricola").value.trim();

  if(!validEmail(email)){
    toast("Email non valida");
    unlock();
    return;
  }

  if(!validMat(matricola)){
    toast("Matricola non valida");
    unlock();
    return;
  }

  currentUser.email = email;
  currentUser.matricola = matricola;

  await save(true);
}

/* ======================
   SAVE
====================== */
async function save(fromComplete=false){

  const pin = fromComplete
    ? currentUser.pin
    : document.getElementById("d_pin").value.trim();

  const email = fromComplete
    ? currentUser.email
    : document.getElementById("d_email").value.trim();

  const matricola = fromComplete
    ? currentUser.matricola
    : document.getElementById("d_matricola").value.trim();

  if(!validPin(pin)){
    toast("PIN non valido");
    unlock();
    return;
  }

  if(!validEmail(email)){
    toast("Email non valida");
    unlock();
    return;
  }

  if(!validMat(matricola)){
    toast("Matricola non valida");
    unlock();
    return;
  }

  currentUser.pin = pin;
  currentUser.email = email;
  currentUser.matricola = matricola;

  const res = await api({
    action:"save",
    user:currentUser
  });

  unlock();

  if(!res.success){
    toast(res.message || "Errore");
    return;
  }

  saveSession();

  if(fromComplete){
    showDash();
  }

  toast("Salvato");
}

/* ======================
   SESSIONE
====================== */
function saveSession(){
  localStorage.setItem(
    "session",
    JSON.stringify(currentUser)
  );
}

function loadSession(){
  const s = localStorage.getItem("session");

  if(!s) return false;

  currentUser = JSON.parse(s);
  showDash();
  return true;
}

function logout(){
  localStorage.removeItem("session");
  location.reload();
}

/* ======================
   UI
====================== */
function showComplete(){
  loginBox.classList.add("hidden");
  completeBox.classList.remove("hidden");
}

function showDash(){
  loginBox.classList.add("hidden");
  completeBox.classList.add("hidden");
  dash.classList.remove("hidden");

  d_username.value = currentUser.username;
  d_pin.value = currentUser.pin;
  d_email.value = currentUser.email;
  d_matricola.value = currentUser.matricola;
}

/* ======================
   INIT
====================== */
window.onload = ()=>{
  loadUsers();

  if(!loadSession()){
    document.getElementById("loginBtn").onclick=login;
    document.getElementById("completeBtn").onclick=complete;
    document.getElementById("saveBtn").onclick=()=>save(false);
    document.getElementById("logoutBtn").onclick=logout;
  }else{
    document.getElementById("saveBtn").onclick=()=>save(false);
    document.getElementById("logoutBtn").onclick=logout;
  }
};
</script>

</body>
</html>
